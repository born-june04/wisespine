# Spine Point Cloud Assembly Project Configuration

# Data paths
data:
  verse_processed_dir: "../../VerSe/processed"
  output_base_dir: "outputs"
  
# Phase 1: Geometry Pipeline
geometry:
  spacing: [1.0, 1.0, 1.0]  # Voxel spacing (dz, dy, dx)
  num_points_per_vertebra: 2048
  sampling_method: "uniform"  # "uniform" or "poisson"
  k_nn: 20  # Number of neighbors for feature computation
  
# Phase 2: Encoder Pretraining
encoder:
  architecture: "se3_equivariant"  # "se3_equivariant" or "pointnet_transformer"
  hidden_dim: 256
  num_layers: 4
  output_dim: 512
  batch_size: 32
  learning_rate: 1e-4
  num_epochs: 100
  
  # Pretraining tasks
  pretraining:
    rotation_canonicalization: true
    contrastive_learning: true
    masked_point_modeling: true
  
# Phase 3: Assembly Training
assembly:
  num_layers: 6
  hidden_dim: 256
  num_heads: 8
  batch_size: 16
  learning_rate: 1e-4
  num_epochs: 50
  
  # Assembly tasks
  tasks:
    ordering: true
    assembly: true
    missing_vertebra_completion: true

# Training
training:
  seed: 42
  num_workers: 4
  pin_memory: false
  use_amp: true  # Automatic mixed precision
  
# Evaluation
evaluation:
  test_split: "test"
  metrics:
    - "identification_rate"
    - "ordering_accuracy"
    - "assembly_error"
    - "partial_robustness"

